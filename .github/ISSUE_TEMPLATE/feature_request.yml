name: Feature request
description: Suggest an idea for WinIsle.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like WinIsle to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to help build this.
