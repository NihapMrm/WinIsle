name: Bug report
description: Something in WinIsle doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please check the [troubleshooting table](https://github.com/NihapMrm/WinIsle/blob/main/docs/guide.md#troubleshooting) and existing issues first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Control Center
        2. Turn off ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WinIsle version
      description: Control Center › About, or the release you downloaded.
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, type winver, press Enter.
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Installer (WinIsle-Setup.exe)
        - Portable WinIsle.exe
        - Built from source
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Screenshots help a lot. Remove any personal notifications or clipboard text first.
